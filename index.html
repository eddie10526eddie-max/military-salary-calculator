<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>國軍薪資加薪計算機 2026</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: #f3f4f6;
    color: #1f2937;
}

.container {
    max-width: 680px;
    margin: auto;
    padding: 20px 16px;
}

.card {
    background: white;
    border-radius: 18px;
    padding: 22px;
    margin-bottom: 16px;
    box-shadow: 0 4px 15px rgba(0,0,0,0.08);
}

h1 {
    margin: 0 0 8px;
    font-size: 26px;
}

h2 {
    margin-top: 0;
}

.subtitle {
    color: #6b7280;
    line-height: 1.6;
}

label {
    display: block;
    margin-top: 16px;
    margin-bottom: 6px;
    font-weight: 600;
}

select,
input {
    width: 100%;
    padding: 13px;
    border: 1px solid #d1d5db;
    border-radius: 10px;
    font-size: 16px;
    background: white;
}

button {
    width: 100%;
    padding: 15px;
    margin-top: 22px;
    border: 0;
    border-radius: 11px;
    background: #111827;
    color: white;
    font-size: 17px;
    font-weight: bold;
}

.result-row {
    display: flex;
    justify-content: space-between;
    padding: 11px 0;
    border-bottom: 1px solid #e5e7eb;
}

.total {
    font-size: 30px;
    font-weight: 800;
}

.note {
    color: #6b7280;
    font-size: 13px;
    line-height: 1.7;
}

.badge {
    display: inline-block;
    background: #e5e7eb;
    padding: 5px 9px;
    border-radius: 8px;
    font-size: 13px;
}
</style>
</head>

<body>

<div class="container">

<div class="card">

<h1>🇹🇼 國軍薪資／加薪計算機</h1>

<p class="subtitle">
2026 軍人薪資、加薪與加給試算工具
</p>

<label>軍階</label>

<select id="rank">
    <option>少尉</option>
    <option>中尉</option>
    <option>上尉</option>
    <option>少校</option>
    <option>中校</option>
    <option>上校</option>
</select>

<label>目前月薪（元）</label>

<input
    id="salary"
    type="number"
    value="66000"
    min="0"
    placeholder="例如：66000"
>

<label>預計調薪幅度（%）</label>

<input
    id="rate"
    type="number"
    value="4"
    min="0"
    step="0.1"
>

<label>其他固定增加（元／月）</label>

<input
    id="fixed"
    type="number"
    value="0"
    min="0"
>

<button onclick="calculate()">
開始計算
</button>

</div>


<div class="card">

<h2>💰 試算結果</h2>

<div class="result-row">
    <span>軍階</span>
    <strong id="resultRank">少尉</strong>
</div>

<div class="result-row">
    <span>目前月薪</span>
    <strong id="oldSalary">$66,000</strong>
</div>

<div class="result-row">
    <span>百分比調薪</span>
    <strong id="percentageIncrease">$2,640</strong>
</div>

<div class="result-row">
    <span>其他固定增加</span>
    <strong id="fixedIncrease">$0</strong>
</div>

<div class="result-row">
    <span>調整後月薪</span>
    <strong id="newSalary" class="total">
        $68,640
    </strong>
</div>

<div class="result-row">
    <span>每月增加</span>
    <strong id="monthlyIncrease">
        $2,640
    </strong>
</div>

<div class="result-row">
    <span>每年增加</span>
    <strong id="yearlyIncrease">
        $31,680
    </strong>
</div>

</div>


<div class="card">

<h2>📌 使用說明</h2>

<p class="note">
本工具目前為薪資試算原型。
正式版本將依國防部、行政院及相關法規公布的最新資料更新。
</p>

<p class="note">
⚠️ 實際薪資會依軍階、俸級、職務、單位及適用加給而有所不同。
</p>

<p>
<span class="badge">資料版本：2026</span>
</p>

</div>

</div>


<script>

function money(number) {
    return "$" + Math.round(number).toLocaleString("zh-TW");
}

function calculate() {

    const rank =
        document.getElementById("rank").value;

    const salary =
        Number(document.getElementById("salary").value) || 0;

    const rate =
        Number(document.getElementById("rate").value) || 0;

    const fixed =
        Number(document.getElementById("fixed").value) || 0;

    const percentageIncrease =
        salary * rate / 100;

    const newSalary =
        salary + percentageIncrease + fixed;

    const monthlyIncrease =
        newSalary - salary;

    const yearlyIncrease =
        monthlyIncrease * 12;


    document.getElementById("resultRank").textContent =
        rank;

    document.getElementById("oldSalary").textContent =
        money(salary);

    document.getElementById("percentageIncrease").textContent =
        money(percentageIncrease);

    document.getElementById("fixedIncrease").textContent =
        money(fixed);

    document.getElementById("newSalary").textContent =
        money(newSalary);

    document.getElementById("monthlyIncrease").textContent =
        money(monthlyIncrease);

    document.getElementById("yearlyIncrease").textContent =
        money(yearlyIncrease);
}

calculate();

</script>

</body>
</html>
